# Copiar para .github/workflows/ci.yml na raiz do repositório do exercício.
name: CI da oficina EPIC

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Build da imagem
        run: docker build -t epic-flask:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Formatação
        run: terraform -chdir=terraform fmt -check
      - name: Inicialização sem backend remoto
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validação
        run: terraform -chdir=terraform validate

# Este exemplo não usa chaves AWS e não executa terraform apply.
